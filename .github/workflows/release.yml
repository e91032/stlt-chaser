name: Build and release

# Every push and pull request builds and tests both platforms.
# Pushing a tag like v1.0.0 also publishes a GitHub release with the installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            dist: dist:win
            artifact: windows
            files: editor/release/*.exe
          - os: macos-14
            dist: dist:mac
            artifact: macos
            files: editor/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the plugins
        run: |
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build --config Release
          cmake --install plugin/build --prefix plugin/dist --config Release

      # A host finds a plugin through plugMain alone; a bundle without it does not load.
      - name: Check the plugin bundles export plugMain
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          bundles=(plugin/dist/*.bundle)
          if [ ${#bundles[@]} -eq 0 ]; then echo "::error::No plugin bundles in plugin/dist"; exit 1; fi
          status=0
          for bundle in "${bundles[@]}"; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .bundle)"
            for arch in $(lipo -archs "$binary"); do
              for symbol in _plugMain _SetLogCallback; do
                if nm -gU -arch "$arch" "$binary" | grep -q " $symbol\$"; then
                  echo "$bundle ($arch) exports $symbol"
                else
                  echo "::error::$bundle ($arch) does not export $symbol"
                  status=1
                fi
              done
            done
          done
          exit $status

      - name: Check the shaders
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install glslang || true
          python3 plugin/tests/check_shaders.py

      - name: Test the document loader
        shell: bash
        run: |
          if [ -f plugin/build/Release/document_test.exe ]; then plugin/build/Release/document_test.exe; else plugin/build/document_test; fi

      - name: Test the Bumper driver
        shell: bash
        run: |
          if [ -f plugin/build/Release/bumper_test.exe ]; then plugin/build/Release/bumper_test.exe; else plugin/build/bumper_test; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Test the editor
        working-directory: editor
        run: |
          npm ci
          npm test

      - name: Package the editor with the plugins
        working-directory: editor
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: STLT-CHASER-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
